<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f1e9">
    <meta name="description" content="此刻，一个简洁的本地时钟。实时显示手机的时间、日期与星期。">
    <title>此刻 · 本地时钟</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="此刻">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <script>
        (() => {
            let darkTheme = false;
            try {
                darkTheme = localStorage.getItem("moment-theme") === "dark";
            } catch (_) { }
            if (darkTheme) {
                document.documentElement.dataset.theme = "dark";
            }
            const statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (statusBar) statusBar.setAttribute("content", darkTheme ? "black-translucent" : "default");
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="lunar.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>
    <main class="page">
        <section class="clock-panel" aria-label="本地时钟">
            <div class="clock-main">
                <div class="panel-top">
                    <span class="small-label" id="greeting">此刻时间</span>
                    <div class="panel-actions">
                        <button class="theme-toggle" id="theme-toggle" type="button"
                            aria-label="切换黑色背景" aria-pressed="false">
                            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z" />
                            </svg>
                            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="4" />
                                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                            </svg>
                        </button>
                        <div class="format-control" role="group" aria-label="时间格式">
                            <button type="button" data-format="24" aria-pressed="true">24 小时</button>
                            <button type="button" data-format="12" aria-pressed="false">12 小时</button>
                        </div>
                    </div>
                </div>
                <div class="time-wrap">
                    <span class="period" id="period" hidden></span>
                    <time id="time" class="time" aria-label="正在读取本地时间">
                        <span id="hours">--</span><span class="colon">:</span><span id="minutes">--</span>
                    </time>
                    <div class="seconds-group" aria-hidden="true"><span id="seconds">--</span><span
                            class="seconds-label">SEC</span></div>
                </div>
                <div class="clock-bottom"><span class="live"><i aria-hidden="true"></i>随设备时间实时更新</span><span
                        id="utc-offset">UTC</span></div>
            </div>
            <div class="calendar">
                <div class="calendar-heading"><span class="small-label">今天</span><span class="calendar-icon"
                        aria-hidden="true"></span></div>
                <time id="date" class="date"><span id="month-year">正在读取日期</span><strong id="day">--</strong><span
                        id="weekday">星期 —</span></time>
                <p class="lunar-date" id="lunar-date">正在读取农历</p>
                <p class="day-note" id="day-note">正在读取节气与节日</p>
                <div class="calendar-foot" id="day-of-year">每一天，都是新的一页。</div>
            </div>
        </section>
        <noscript>
            <p class="notice">请开启浏览器 JavaScript，以显示实时本地时间。</p>
        </noscript>
    </main>
</body>

</html>
